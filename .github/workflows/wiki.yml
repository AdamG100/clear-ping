name: Wiki

# The GitHub wiki, made from docs/ (scripts/wiki.mjs) whenever the guides on
# main change. docs/ is where the guides are written; edits made on the wiki
# itself are replaced.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/wiki.mjs'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: Publish the wiki
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check out the wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Make the pages
        run: node scripts/wiki.mjs wiki

      - name: Publish
        working-directory: wiki
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "The wiki is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update from docs/ at ${GITHUB_SHA::7}"
          git push

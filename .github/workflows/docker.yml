name: Docker image

# Builds the image from docker/Dockerfile for x64 and ARM64, checks that each
# one actually runs, and publishes them to the GitHub Container Registry under
# one name, so `docker pull` picks the right one for the machine.
#
#   pull request      build and test only, nothing is published
#   push to main      ghcr.io/<owner>/<repo>:latest, :<version> and :sha-<commit>,
#                     then a git tag v<version> and a GitHub release of it
#   tag v1.2.3        ghcr.io/<owner>/<repo>:1.2.3 and :1.2
#
# Every build of main is a deployment with a version number of its own: one
# more than the last release, as a patch unless a commit since then asks for a
# minor or major one with a trailer in its message, `Release: minor` or
# `Release: major` (scripts/next-version.mjs). The number is baked into the
# image, where the dashboard shows it and compares it with whatever :latest is
# to say whether there is an update.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The number this build goes out as, worked out once so both architectures
  # carry the same one.
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.number.outputs.version }}
      built_at: ${{ steps.number.outputs.built_at }}
      image: ${{ steps.number.outputs.image }}
      release: ${{ steps.number.outputs.release }}

    steps:
      # Every tag, to count on from, and the commits since, for their trailers.
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Number the build
        id: number
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # Tagged by hand: the tag is the version, and it has its release already.
            version=${GITHUB_REF_NAME#v}
            release=false
          else
            # The last release plus whatever the commits since ask for in a
            # Release: trailer (scripts/next-version.mjs).
            version=$(node scripts/next-version.mjs --explain)

            # Only main is deployed. Anything else is marked as not a release,
            # so it can never be mistaken for one or count as newer than one.
            if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
              release=true
            else
              version="${version}-dev.${GITHUB_SHA::7}"
              release=false
            fi
          fi

          {
            echo "version=$version"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "image=${REGISTRY}/${IMAGE_NAME,,}"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"
          echo "### Version $version" >> "$GITHUB_STEP_SUMMARY"

  # One job per architecture, each on a runner of that architecture. Nothing
  # is emulated, so the build is as fast as it was and the smoke test below
  # runs the real thing on both.
  build:
    name: Build (${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The cache is kept per architecture, or the two jobs would overwrite
      # each other's layers.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: clearping:ci
          build-args: |
            CLEARPING_VERSION=${{ needs.version.outputs.version }}
            CLEARPING_COMMIT=${{ github.sha }}
            CLEARPING_BUILT_AT=${{ needs.version.outputs.built_at }}
            CLEARPING_IMAGE=${{ needs.version.outputs.image }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # A build that succeeds says the image exists, not that it works. This
      # starts it and takes a real reading: the server answers, the database
      # is writable, and `ping` runs as the unprivileged user.
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # No database may ship inside the image. Looked for before the first
          # start, since starting is what creates the real one in /data.
          shipped=$(docker run --rm clearping:ci sh -c \
            "find /app /data -path '*/node_modules' -prune -o -type f \( -name '*.db' -o -name '*.db-wal' -o -name '*.db-shm' -o -name '*.db.*' \) -print")
          if [ -n "$shipped" ]; then
            echo "::error::The image contains a database: $shipped"
            exit 1
          fi

          # Not asking the registry for updates: the test is of this image alone.
          docker run -d --name clearping -p 3000:3000 -e CLEARPING_UPDATE_CHECK=off clearping:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/scheduler/status > /dev/null; then
              up=1
              break
            fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::The server did not come up"
            docker logs clearping
            exit 1
          fi

          # The number the dashboard shows is the one this build was given.
          if ! curl -fsS http://localhost:3000/api/version | jq -e --arg v "$VERSION" '.current.version == $v and .current.development == false'; then
            echo "::error::The image does not report version $VERSION"
            exit 1
          fi

          # A new install starts empty: no targets carried over from anywhere.
          if ! curl -fsS http://localhost:3000/api/targets | jq -e 'length == 0' > /dev/null; then
            echo "::error::A fresh container already has targets in it"
            exit 1
          fi

          docker exec clearping sh -c 'command -v ping && command -v traceroute'

          # Alerts are sent by Apprise, as the user the app runs as. A dry run
          # sends nothing, and fails if Apprise cannot load the service. MQTT
          # is one of the services that need a package beyond Apprise's own,
          # so this also says the extra packages made it into the image.
          if ! docker exec -e APPRISE_URLS='mqtt://127.0.0.1/topic' clearping apprise --dry-run; then
            echo "::error::Apprise does not run inside the container, or is missing its optional services"
            exit 1
          fi

          id=$(curl -fsS -X POST http://localhost:3000/api/targets \
            -H 'Content-Type: application/json' \
            -d '{"name":"loopback","host":"127.0.0.1","probeType":"ping","interval":300}' | jq -r .id)

          if ! curl -fsS -X POST "http://localhost:3000/api/targets/$id/probe" | jq -e '.result.success == true'; then
            echo "::error::A ping of 127.0.0.1 from inside the container failed"
            docker logs clearping
            exit 1
          fi

      - name: Log in to the registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry only takes lower-case names, and the owner's is not.
      - name: Work out the image name
        id: image
        if: github.event_name != 'pull_request'
        run: echo "name=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Work out labels
        id: meta
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ needs.version.outputs.version }}

      # The layers are already in the cache from the build above, so this only
      # uploads them. It is pushed without a tag, by its digest: the tags
      # belong to the pair, and the publish job puts them on once both exist.
      - name: Push by digest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          # The same as the build above, or this would be a different image.
          build-args: |
            CLEARPING_VERSION=${{ needs.version.outputs.version }}
            CLEARPING_COMMIT=${{ github.sha }}
            CLEARPING_BUILT_AT=${{ needs.version.outputs.built_at }}
            CLEARPING_IMAGE=${{ needs.version.outputs.image }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Record the digest
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Hand the digest to the publish job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two images under the tags people pull. It needs both builds to
  # have passed, so a tag never points at an image for one architecture only.
  publish:
    name: Publish
    needs: [version, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Collect the digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Tag the pair
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="${REGISTRY}/${IMAGE_NAME,,}"
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$image@sha256:%s " *)

          # Printed so the log shows both architectures behind the tag.
          docker buildx imagetools inspect "$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"

  # Marks the commit with the version once its image is out, and writes up
  # what changed since the last one. Only after publishing: a version is not
  # used up by a build that failed, so the numbers run on without gaps. Tags
  # made with this job's token start no workflow, so this cannot loop.
  release:
    name: Release
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          gh release create "v$VERSION" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --notes "Image: \`$IMAGE:$VERSION\`" \
            --generate-notes

name: Dependency updates

# Merges or closes Dependabot's pull requests: updates that are ready are merged,
# and ones that failed, were replaced by a group or got stuck are closed. The
# rules are the same for every repository and kept in one place:
# https://github.com/AdamG100/.github/blob/main/.github/workflows/dependency-updates.yml

on:
  workflow_run:
    workflows: [Checks, Docker image]
    types: [completed]
  # Looks again at updates that are waiting.
  schedule:
    - cron: "30 5 */2 * *"
  workflow_dispatch:

jobs:
  merge:
    uses: AdamG100/.github/.github/workflows/dependency-updates.yml@main
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      check-workflows: checks.yml docker.yml
      deploy-workflow: docker.yml
      deploy-args: "-f force=false"
    secrets:
      # Optional: a token allowed to change workflows, to merge GitHub Actions updates.
      merge-token: ${{ secrets.DEPENDENCY_MERGE_TOKEN }}

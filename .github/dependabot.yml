version: 2
updates:
  # The actions the release workflow runs, pinned to commit SHAs.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Node base image, pinned by digest. Merged and released without anyone
  # asking, once the images built with it pass (workflows/auto-merge.yml).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: daily
  # Apprise and what it pulls in, pinned by hash.
  - package-ecosystem: pip
    directory: /docker
    schedule:
      interval: weekly

# ClearPing with Docker Compose. Copy it and make it yours:
#
#   curl -o compose.yaml https://raw.githubusercontent.com/AdamG100/clear-ping/main/compose.example.yaml
#   mkdir -p data && sudo chown -R 1000:1000 data     # Linux: the container runs as uid 1000
#   docker compose up -d
#
# Then open http://<this machine>:3000. The first account asks for a setup
# code, which is in `docker logs clearping`.
#
# Sign-in is off until you turn it on, and while it is off anyone who can reach
# ClearPing can use all of it. Create the first account, then turn on
# Settings -> Access -> Require sign-in. To reach it from outside your network,
# put it behind a reverse proxy with HTTPS: docs/reverse-proxy.md has Caddy,
# nginx, Traefik, Cloudflare Tunnel and Tailscale set up step by step.

services:
  clearping:
    image: ghcr.io/adamg100/clear-ping:latest
    container_name: clearping
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # The time zone every time in ClearPing is shown in: the charts, the
      # routes, the alerts it sends and when maintenance runs. An IANA name
      # (https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
      # Left out, each person sees their own time and the container keeps UTC.
      TZ: Etc/UTC
      # Behind a reverse proxy, uncomment these two (docs/reverse-proxy.md):
      # The name ClearPing is reached at; requests for any other are refused.
      # CLEARPING_ALLOWED_HOSTS: ping.example.com
      # How many proxies in front add to X-Forwarded-For.
      # CLEARPING_TRUST_PROXY: 1
    volumes:
      # The database. The container runs as uid 1000, so on Linux create the
      # folder first and hand it over (the commands at the top), or ClearPing
      # cannot write to it. Startup logs the command if the folder is still root's.
      - ./data:/data
